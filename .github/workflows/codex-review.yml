
name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex Review
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          codex exec \
            --sandbox read-only \
            -o review.txt \
            "Review the code changes between \
            $BASE_SHA and $HEAD_SHA.

            Focus on:
            - Bugs and logical errors
            - Swift concurrency issues
            - Memory leaks
            - Thread safety
            - Architecture violations

            Do not modify files.
            Write the review in Korean.
            Include file paths and line numbers.
            If there are no issues, say so."
        
      - name: Check Codex environment
        shell: bash
        run: |
          echo "Runner user: $(whoami)"
          echo "HOME: $HOME"
          command -v codex
          codex --version
          codex login status

      - name: Test Codex execution
        shell: bash
        run: |
          codex exec \
            --sandbox read-only \
            --skip-git-repo-check \
            "Reply with exactly: Codex CI OK"

