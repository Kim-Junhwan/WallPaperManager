
name: Mac Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, macOS, mac-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check macOS
        run: |
          sw_vers
          uname -m

      - name: Check Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Runner Information
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Hostname: $(hostname)"
          echo "Current user: $(whoami)"

